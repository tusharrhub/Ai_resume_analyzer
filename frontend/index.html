<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">ATS Resume Checker</h1>
        <form id="analyzeForm" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="resumeFile" class="form-label">Upload Resume (PDF)</label>
                <input type="file" class="form-control" id="resumeFile" accept=".pdf">
            </div>
            <div class="mb-3">
                <label for="resumeText" class="form-label">Or Paste Resume Text</label>
                <textarea class="form-control" id="resumeText" rows="5" placeholder="Paste your resume text here..."></textarea>
            </div>
            <div class="mb-3">
                <label for="jobDesc" class="form-label">Job Description</label>
                <textarea class="form-control" id="jobDesc" rows="5" placeholder="Paste the job description here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Analyze Resume</button>
        </form>
        <div id="results" class="mt-5" style="display: none;">
            <h2>Analysis Results</h2>
            <div class="mb-3">
                <h3>ATS Match Score</h3>
                <div class="progress">
                    <div id="scoreBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
                <p id="scoreText"></p>
            </div>
            <div class="mb-3">
                <h3>Missing Keywords</h3>
                <p id="missingKeywords"></p>
            </div>
            <div class="mb-3">
                <h3>Matching Skills</h3>
                <p id="matchingSkills"></p>
            </div>
            <div class="mb-3">
                <h3>Suggestions</h3>
                <ul id="suggestions"></ul>
            </div>
            <div class="mb-3">
                <h3>Section-wise Feedback</h3>
                <div id="feedback"></div>
            </div>
            <button id="downloadBtn" class="btn btn-secondary">Download Suggestions</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
